name: Apply review decisions

# Runs when a review PR is merged (or a review file is edited on main).
on:
  push:
    branches: [main]
    paths: ['data/review/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: node pipeline/apply-review.js

      - name: Commit updated digests
        run: |
          git config user.name "good-news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "Nothing to apply."
          else
            git commit -m "Apply review decisions"
            git push
          fi
